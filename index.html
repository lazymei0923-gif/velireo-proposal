<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velireo Skin｜電商平臺功能提案</title>

<!--
  ============================================================
  Velireo Skin 電商平臺功能提案 ・ 14 頁簡報
  視覺規範：Bright Premium 暖瓷白（#FFFDF9 / #C9817A / Noto Serif TC）
  操作：→/Space 下一頁、← 上一頁、滾輪翻頁、點擊右半下一頁/左半上一頁、
        F 全螢幕、D 塗鴉、P 筆 H 螢光筆 R 方框、C 清除、🔒 鎖定防誤觸
  ------------------------------------------------------------
  ▶ DEMO 影片置換方式：
    找到 .vslot（共 8 個，data-module 標示模組名），
    整塊換成 <video class="vfill" controls src="影片路徑.mp4" poster="封面.jpg"></video>
    或把錄好的影片放進 .vslot 內即可（已固定 16:9）。
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#FFFDF9; --bg2:#EFEAE0; --cream:#D8C5B5;
  --ink:#2B2B2B; --soft:#6B625C; --cta:#C9817A;
  --surface:#FFFFFF; --line:rgba(43,43,43,.10); --line2:rgba(43,43,43,.18);
  --cta-soft:rgba(201,129,122,.12); --cta-soft2:rgba(201,129,122,.22);
  --serif:"Noto Serif TC",serif; --sans:"Noto Sans TC","Inter",system-ui,sans-serif; --eng:"Cormorant Garamond",serif;
  --r:18px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}

/* ---------- slide system ---------- */
.deck{ position:fixed; inset:0; }
.slide{
  position:fixed; inset:0; display:flex; align-items:stretch; justify-content:center;
  padding:52px 92px 56px; opacity:0; visibility:hidden;
  transition:opacity .45s ease; background:var(--bg);
}
.slide.active{ opacity:1; visibility:visible; }
.slide::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(1100px 560px at 82% -10%, rgba(201,129,122,.10), transparent 60%),
    radial-gradient(900px 520px at -8% 112%, rgba(216,197,181,.20), transparent 56%);
}
.inner{ position:relative; width:100%; max-width:1200px; z-index:2; display:flex; flex-direction:column; }
/* header (1st child) pinned top; content block (2nd..last) centered in remaining space */
.inner > :nth-child(2){ margin-top:auto; }
.inner > :last-child{ margin-bottom:auto; }
.inner.closing{ justify-content:center; }
.inner.closing > :nth-child(2){ margin-top:0; }
.inner.closing > :last-child{ margin-bottom:0; }

/* reveal */
@keyframes rise{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;} }
.slide.active .inner > *{ animation:rise .55s both; }
.slide.active .inner > *:nth-child(1){ animation-delay:.02s; }
.slide.active .inner > *:nth-child(2){ animation-delay:.10s; }
.slide.active .inner > *:nth-child(3){ animation-delay:.18s; }
.slide.active .inner > *:nth-child(4){ animation-delay:.26s; }

/* ---------- typography ---------- */
.kicker{
  font-family:var(--sans); font-size:14px; font-weight:600; letter-spacing:.22em;
  text-transform:uppercase; color:var(--cta); margin-bottom:16px;
}
.slide-title{ font-family:var(--serif); font-weight:700; font-size:clamp(27px,2.8vw,38px); line-height:1.2; color:var(--ink); }
.slide-sub{ font-size:clamp(17px,1.35vw,21px); line-height:1.65; color:var(--soft); margin-top:14px; max-width:880px; }

/* ---------- top / bottom bars ---------- */
.topbar{ position:fixed; top:30px; left:88px; right:88px; z-index:60; display:flex; justify-content:space-between; align-items:center; }
.wordmark{ display:flex; align-items:center; gap:11px; font-size:15px; font-weight:500; letter-spacing:.30em; color:var(--ink); }
.wm-dot{ width:9px; height:9px; border-radius:50%; background:var(--cta); display:inline-block; }
.topbar-tag{ font-size:14px; letter-spacing:.04em; color:var(--soft); }

.botbar{ position:fixed; left:88px; bottom:34px; z-index:60; display:flex; align-items:center; gap:16px; }
.dots{ display:flex; gap:7px; align-items:center; }
.dot{ width:9px; height:9px; border-radius:50%; background:var(--line2); cursor:pointer; transition:.22s; border:none; padding:0; }
.dot:hover{ background:var(--cta-soft2); }
.dot.on{ background:var(--cta); width:24px; border-radius:6px; }
.pageno{ font-size:14px; letter-spacing:.12em; color:var(--soft); font-variant-numeric:tabular-nums; }

.hint{ position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:55; font-size:13px; color:var(--soft); opacity:.62; letter-spacing:.04em; }

/* ---------- cover ---------- */
.cover .kicker{ font-size:15px; }
.cover-title{ font-family:var(--serif); font-weight:700; font-size:clamp(42px,4.6vw,62px); line-height:1.18; color:var(--ink); letter-spacing:.01em; }
.cover-sub{ font-size:clamp(18px,1.6vw,24px); color:var(--soft); line-height:1.6; margin-top:22px; max-width:760px; }
.cover-rule{ width:72px; height:3px; background:var(--cta); border-radius:3px; margin:34px 0 30px; }
.cover-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:14px 26px; }
.cover-meta span{ font-size:16px; color:var(--ink); }
.cover-meta .sep{ width:5px; height:5px; border-radius:50%; background:var(--cream); }
.cover-pill{ display:inline-flex; align-items:center; gap:8px; margin-top:30px; font-size:16px; font-weight:600;
  color:var(--cta); background:var(--cta-soft); border:1px solid var(--cta-soft2); padding:11px 20px; border-radius:999px; }
.cover-pill b{ font-family:var(--serif); font-size:20px; }
/* cover 2-col + image slot */
.cover-grid{ display:grid; grid-template-columns:1.12fr .88fr; gap:64px; align-items:center; }
.cover-img{ display:flex; justify-content:center; }
.cover-img .imgslot{ height:clamp(340px,58vh,500px); aspect-ratio:4/5; }
/* full-bleed photo cover */
.slide-cover{ padding:0; }
.cover-full{ position:absolute; inset:0; overflow:hidden; }
.cover-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:46% center; }
.cover-veil{ position:absolute; inset:0; background:linear-gradient(95deg, #FFFDF9 0%, #FFFDF9 30%, rgba(255,253,249,.97) 43%, rgba(255,253,249,.55) 55%, rgba(255,253,249,0) 68%);
  -webkit-mask-image:linear-gradient(to bottom, #000 80%, transparent 90%); mask-image:linear-gradient(to bottom, #000 80%, transparent 90%); }
.cover-panel{ position:absolute; left:84px; top:50%; transform:translateY(-50%); width:min(540px,46%); }
.cover-panel .cover-title{ font-size:clamp(36px,3.6vw,52px); line-height:1.16; }
.cover-panel .cover-sub{ margin-top:14px; font-size:clamp(16px,1.25vw,19px); max-width:460px; }
.cover-panel .cover-pill{ margin-top:22px; }
.cover-stats{ margin-top:26px; display:flex; flex-direction:column; gap:10px; }
.cstat{ font-family:var(--eng); font-size:24px; font-weight:600; color:var(--ink); letter-spacing:.015em; line-height:1.15; }
.cstat.tagline{ margin-top:8px; font-family:var(--sans); font-size:14px; font-weight:600; color:var(--cta); letter-spacing:.16em; text-transform:uppercase; }
body.on-cover .topbar, body.on-cover .hint, body.on-cover .botbar{ opacity:0; pointer-events:none; }
/* 共用圖片置換槽 */
.imgslot{ position:relative; border-radius:24px; overflow:hidden;
  background:linear-gradient(158deg,#FFFFFF 0%,#F1E9DF 68%,#E7DACC 100%);
  border:1.5px dashed rgba(201,129,122,.45);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  box-shadow:0 40px 80px -36px rgba(43,43,43,.42); }
.imgslot .ifill{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.imgslot .ico{ width:60px; height:60px; border-radius:50%; background:var(--cta-soft2); color:var(--cta); display:grid; place-items:center; font-size:26px; }
.imgslot .cap{ font-family:var(--serif); font-size:17px; font-weight:600; color:var(--ink); }
.imgslot .note{ font-size:13px; color:var(--soft); }

/* ---------- goals / diff cards ---------- */
.head-block{ margin-bottom:26px; }
.cards-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:30px 30px 32px;
  box-shadow:0 30px 60px -42px rgba(43,43,43,.4); }
.card .num{ font-family:var(--eng); font-size:34px; color:var(--cta); font-weight:600; line-height:1; }
.card h3{ font-family:var(--serif); font-size:23px; font-weight:700; color:var(--ink); margin:16px 0 10px; }
.card p{ font-size:17px; line-height:1.7; color:var(--soft); }
/* goals 左圖右卡 */
.goals-grid{ display:grid; grid-template-columns:1.32fr 1fr; gap:44px; align-items:center; }
.goals-vid{ width:100%; aspect-ratio:3 / 2; border-radius:18px; overflow:hidden; background:#000; box-shadow:0 30px 64px -40px rgba(43,43,43,.45); }
.goals-vid video{ width:100%; height:100%; object-fit:cover; display:block; }
.goals-img{ display:flex; }
.goals-img .imgslot{ width:100%; min-height:380px; }
.goals-cards{ display:flex; flex-direction:column; gap:16px; justify-content:center; }
.card.row{ display:flex; gap:20px; align-items:flex-start; padding:22px 26px; }
.card.row .num{ font-size:30px; }
.card.row h3{ margin:0 0 6px; font-size:21px; }
.card.row p{ font-size:16px; line-height:1.6; }
.core-bar{ margin-top:26px; background:var(--cta-soft); border-left:4px solid var(--cta); border-radius:12px;
  padding:20px 26px; font-size:19px; font-weight:600; color:var(--ink); line-height:1.55; }

/* diff cards (2x2) */
.cards-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
.dcard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:22px 30px;
  box-shadow:0 30px 60px -44px rgba(43,43,43,.4); }
.dcard .tag{ display:inline-block; font-size:14px; font-weight:600; color:#a85f58; background:rgba(201,129,122,.10);
  padding:5px 12px; border-radius:999px; margin-bottom:14px; }
.dcard h3{ font-family:var(--serif); font-size:21px; font-weight:700; color:var(--ink); }
.dcard .sol{ font-size:17px; line-height:1.65; color:var(--soft); margin-top:12px; padding-top:12px; border-top:1px dashed var(--line2); }
.dcard .sol b{ color:var(--cta); }

/* ---------- module (demo) slide ---------- */
.mod-head{ margin-bottom:26px; }
.mod-grid{ display:grid; grid-template-columns:.8fr 1.2fr; gap:60px; align-items:center; }
.mod-feats{ display:flex; flex-direction:column; }
.ft{ position:relative; padding:15px 0 15px 24px; border-bottom:1px solid var(--line); }
.ft:last-child{ border-bottom:none; }
.ft::before{ content:'✦'; position:absolute; left:0; top:13px; font-size:13px; color:var(--cta); }
.ft b{ font-size:17px; font-weight:700; color:var(--ink); }
.ft span{ font-size:16px; line-height:1.55; color:var(--soft); }

.mod-video{ }
.demo-badge{ display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--cta);
  background:var(--cta-soft); border:1px solid var(--cta-soft2); padding:8px 15px; border-radius:999px; margin-bottom:16px; }
.vslot{ position:relative; width:100%; aspect-ratio:16/9; border-radius:20px; overflow:hidden;
  background:linear-gradient(158deg,#FFFFFF 0%,#F3ECE2 60%,#EFEAE0 100%);
  border:1.5px dashed rgba(201,129,122,.5);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:13px;
  box-shadow:0 34px 70px -34px rgba(43,43,43,.45); }
.vslot .vfill{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.vslot-play{ width:64px; height:64px; border-radius:50%; background:var(--cta); color:#fff; display:grid; place-items:center;
  font-size:24px; padding-left:5px; box-shadow:0 12px 28px -6px rgba(201,129,122,.65); }
.vslot-cap{ font-family:var(--serif); font-size:18px; font-weight:600; color:var(--ink); }
.vslot-note{ font-size:14px; color:var(--soft); }
.mod-foot{ margin-top:14px; font-size:14px; color:var(--soft); }

/* ---------- map slide (lanes / index) ---------- */
.mapx{ margin-top:2px; border:1px solid var(--line); border-radius:20px; overflow:hidden;
  background:var(--surface); box-shadow:0 32px 66px -46px rgba(43,43,43,.42); }
.lane{ display:grid; grid-template-columns:178px 1fr; align-items:center; gap:22px; padding:9px 28px; }
.lane + .lane{ border-top:1px solid var(--line); }
.lane:nth-child(even){ background:#FCF8F1; }
.lane-cat{ display:flex; align-items:center; gap:12px; }
.lane-meta{ display:flex; flex-direction:column; gap:2px; }
.lane-name{ font-family:var(--serif); font-size:18px; font-weight:700; color:var(--ink); line-height:1.2; }
.lane-count{ font-size:12px; color:var(--soft); }
.lane .ovx-ico{ width:48px; height:48px; border-radius:14px; }
.lane .ovx-ico svg{ width:24px; height:24px; }
.lane-tiles{ display:flex; flex-wrap:wrap; gap:13px; }
.chip{ display:inline-flex; align-items:center; gap:6px; font-size:15px; line-height:1; padding:9px 14px; border-radius:11px; background:#FFFFFF; border:1px solid rgba(43,43,43,.12); color:var(--ink); white-space:nowrap; }
.chip::before{ content:'\203A'; color:var(--soft); font-size:15px; font-weight:700; }
/* overview (p12) has spare room — loosen its lanes (map p3 stays tight for 6 rows) */
.slide-overview .lane{ padding:17px 30px; }
.slide-overview .lane-tiles{ gap:16px; }
.slide-overview .chip{ padding:11px 17px; }
.chip.demo{ background:rgba(201,129,122,.07); color:#a85f58; font-weight:600; border-color:var(--cta-soft2); }
.chip.demo::before{ content:'\203A'; color:#a85f58; }
.map-note{ margin-top:15px; font-size:15px; color:var(--soft); }
.map-note .dm{ color:#a85f58; font-weight:600; }

/* ---------- overview slide (bento) ---------- */
.ovx{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:start; }
.ovx-cell{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 20px;
  box-shadow:0 28px 54px -46px rgba(43,43,43,.4); }
.ovx-cell.wide{ grid-column:1 / -1; }
.ovx-head{ display:flex; align-items:center; gap:11px; margin-bottom:11px; }
.ovx-ico{ width:36px; height:36px; border-radius:11px; background:var(--cta-soft); color:var(--cta); display:grid; place-items:center; flex:none; }
.ovx-title{ font-family:var(--serif); font-size:18px; font-weight:700; color:var(--ink); }
.ovx-count{ margin-left:auto; font-size:12px; color:var(--soft); background:var(--bg2); padding:4px 10px; border-radius:999px; white-space:nowrap; }
.ovx-tiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
.ovx-tiles.cols4{ grid-template-columns:repeat(4,1fr); }
.ovx-tile{ display:flex; align-items:center; gap:9px; padding:8px 12px; border-radius:10px; background:var(--bg2); font-size:15px; color:var(--ink); }
.ovx-tile::before{ content:'✦'; color:var(--cta); font-size:10px; flex:none; }

/* ---------- process slide ---------- */
.flow{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-top:10px; position:relative; }
.flow::before{ content:''; position:absolute; left:6%; right:6%; top:34px; height:2px; background:linear-gradient(90deg,var(--cream),var(--cta)); opacity:.5; }
.step{ position:relative; text-align:center; }
.step .bub{ width:68px; height:68px; margin:0 auto 16px; border-radius:50%; background:var(--surface); border:2px solid var(--cta);
  display:grid; place-items:center; font-family:var(--eng); font-size:26px; font-weight:600; color:var(--cta);
  box-shadow:0 14px 30px -14px rgba(201,129,122,.55); position:relative; z-index:2; }
.step h4{ font-family:var(--serif); font-size:19px; font-weight:700; color:var(--ink); }
.timebar{ margin-top:46px; display:flex; align-items:center; gap:16px; background:var(--cta-soft);
  border:1px solid var(--cta-soft2); border-radius:14px; padding:22px 28px; }
.timebar .lab{ font-family:var(--eng); font-size:34px; font-weight:600; color:var(--cta); white-space:nowrap; }
.timebar .txt{ font-size:18px; line-height:1.6; color:var(--ink); }
.proc-note{ margin-top:18px; text-align:center; font-size:16px; color:var(--soft); }

/* mod value headline / closing line */
.mod-headline{ font-size:clamp(27px,2.8vw,38px); line-height:1.32; max-width:1040px; }
.mod-close{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line); font-size:15px; font-weight:600; color:var(--cta); }
.vslot-play svg{ width:28px; height:28px; }
/* portrait (phone) demo video */
.mod-video.is-portrait{ display:flex; flex-direction:column; align-items:center; width:100%; }
.vslot.vslot-portrait{ width:auto; height:min(440px,56vh); aspect-ratio:600/1300; box-shadow:0 30px 64px -28px rgba(43,43,43,.5); }
.phone-row{ display:flex; justify-content:center; align-items:flex-end; gap:16px; width:100%; }
.phone-row .vslot.vslot-portrait{ width:calc((100% - 32px)/3); max-width:188px; height:auto; }

/* brand-story / product page section gallery */
.carousel{ max-width:940px; margin:0 auto; }
.carousel.in-slot{ max-width:none; margin:0; }
.cstage{ position:relative; aspect-ratio:16/9; border-radius:16px; overflow:hidden; border:1px solid var(--line);
  background:linear-gradient(160deg,#FBF7F1,#EFEAE0); box-shadow:0 30px 66px -40px rgba(43,43,43,.45); }
.cslide{ position:absolute; inset:0; margin:0; opacity:0; transition:opacity .6s ease; }
.cslide.on{ opacity:1; }
.cslide img{ width:100%; height:100%; object-fit:contain; display:block; }
.cbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:14px; padding:0 4px; }
.ccap{ position:relative; flex:1; height:22px; }
.ccapt{ position:absolute; left:0; top:0; opacity:0; transition:opacity .4s; font-size:15px; font-weight:600; color:var(--ink); white-space:nowrap; }
.ccapt::before{ content:'›'; color:var(--cta); margin-right:7px; }
.ccapt.on{ opacity:1; }
.cdots{ display:flex; gap:8px; }
.cdot{ width:9px; height:9px; border-radius:50%; background:var(--line2); border:none; cursor:pointer; transition:.2s; padding:0; }
.cdot.on{ background:var(--cta); width:24px; border-radius:6px; }

/* compare slide (一般電商 vs 我們) */
.cmp-grid{ display:grid; grid-template-columns:1fr auto 1.3fr; gap:24px; align-items:center; margin-top:6px; }
.cmp-card{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:30px 34px; }
.cmp-name{ font-family:var(--serif); font-size:22px; font-weight:700; margin-bottom:18px; }
.cmp-card ul{ list-style:none; display:flex; flex-direction:column; gap:13px; }
.cmp-card li{ position:relative; padding-left:30px; font-size:18px; line-height:1.4; }
.cmp-card li::before{ content:'✓'; position:absolute; left:0; top:0; font-weight:700; }
.cmp-plain{ background:#FBF7F1; }
.cmp-plain .cmp-name{ color:var(--soft); }
.cmp-plain li{ color:var(--soft); }
.cmp-plain li::before{ color:var(--cream); }
.cmp-ours{ border-color:var(--cta-soft2); background:linear-gradient(165deg, rgba(201,129,122,.10), #FFFFFF 62%); box-shadow:0 34px 70px -38px rgba(201,129,122,.6); }
.cmp-ours .cmp-name{ color:var(--cta); }
.cmp-ours li{ color:var(--ink); font-weight:500; }
.cmp-ours li::before{ color:var(--cta); }
.cmp-vs{ font-family:var(--eng); font-size:22px; font-weight:600; color:var(--cream); letter-spacing:.1em; }

/* compare2: 問題 × 價值 table + 核心優勢 box */
.c2-table{ display:grid; grid-template-columns:1fr 1.18fr; border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 26px 54px -44px rgba(43,43,43,.4); }
.c2-th{ font-family:var(--serif); font-weight:700; font-size:16px; padding:18px 32px; background:#F2EBE2; color:var(--ink); }
.c2-th-r{ color:#a85f58; background:var(--cta-soft); }
.c2-q,.c2-v{ padding:17px 32px; font-size:15.5px; line-height:1.6; border-top:1px solid var(--line); }
.c2-q{ color:var(--soft); }
.c2-v{ color:var(--ink); font-weight:500; background:rgba(201,129,122,.05); }
.c2-v::before{ content:'✓ '; color:var(--cta); font-weight:700; }
.c2-foot{ display:grid; grid-template-columns:1fr 1.18fr; gap:18px; margin-top:16px; align-items:stretch; }
.c2-close{ display:flex; align-items:center; font-family:var(--serif); font-size:18px; font-weight:600; line-height:1.45; color:var(--ink);

/* ============================================================
   P0 視覺優化（主底鎖 #FFFDF9，層次只做在 surface；跟 Codex 定案）
   ============================================================ */
:root{
  --paper:#FFFFFF; --paper-warm:#FFFBF6; --paper-tint:#FBF7F1;
  --hairline:rgba(43,43,43,.14); --hairline-soft:rgba(43,43,43,.09);
  --shadow-1:0 1px 0 rgba(255,255,255,.9) inset, 0 18px 42px -34px rgba(43,43,43,.46);
  --shadow-2:0 1px 0 rgba(255,255,255,.92) inset, 0 28px 70px -42px rgba(43,43,43,.52);
  --shadow-rose:0 1px 0 rgba(255,255,255,.9) inset, 0 30px 72px -44px rgba(201,129,122,.42);
  --media-shadow:0 1px 0 rgba(255,255,255,.75) inset, 0 34px 78px -38px rgba(43,43,43,.62);
  --cta-ink:#A85F58;
}
/* 主底鎖死 #FFFDF9；glow 收淡避免整頁被染 */
body,.slide{ background:#FFFDF9; }
.slide::before{
  background:
    radial-gradient(900px 480px at 84% -12%, rgba(201,129,122,.055), transparent 62%),
    radial-gradient(760px 460px at -8% 112%, rgba(216,197,181,.09), transparent 58%);
}
/* ① elevation：白面 + 雙層柔影 + hairline */
.card,.dcard,.cmp-card,.card.row{ background:var(--paper); border:1px solid var(--hairline); box-shadow:var(--shadow-1); }
.mapx,.c2-table{ background:var(--paper); border:1px solid var(--hairline); box-shadow:var(--shadow-2); }
.core-bar{ border-left-width:5px; }
/* ② map p3：白面板 + 極淡暖白斑馬 + chip 立起 */
.slide-map .lane{ background:var(--paper); }
.slide-map .lane:nth-child(even){ background:var(--paper-warm); }
.slide-map .lane + .lane{ border-top:1px solid var(--hairline-soft); }
.slide-map .lane-cat{ padding-right:18px; border-right:1px solid var(--hairline-soft); }
.slide-map .chip{ background:#FFFFFF; border:1px solid rgba(43,43,43,.15); box-shadow:0 10px 22px -18px rgba(43,43,43,.42); }
.slide-map .chip.demo{ background:#FFF7F4; border-color:rgba(201,129,122,.40); color:var(--cta-ink); box-shadow:0 10px 24px -20px rgba(201,129,122,.48), inset 0 0 0 1px rgba(201,129,122,.08); }
/* ③ 媒體框：深色只在裝置內框，外圈瓷白襯環；圖庫/圖用白面 */
.vslot.is-filled,.goals-vid.is-filled{ position:relative; background:#181514; border:1px solid rgba(43,43,43,.22); box-shadow:var(--media-shadow); }
.vslot.is-filled::after,.goals-vid.is-filled::after{ content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; box-shadow:inset 0 0 0 9px rgba(255,253,249,.76), inset 0 0 0 10px rgba(43,43,43,.10); }
.cstage.is-filled,.imgslot.is-filled{ background:var(--paper); border:1px solid var(--hairline); box-shadow:var(--media-shadow); }
/* ④ module 垂直節奏：去死白、主張→證據更緊 */
.slide-module .inner{ justify-content:center; }
.slide-module .inner > :nth-child(2){ margin-top:0; }
.slide-module .inner > :last-child{ margin-bottom:0; }
.slide-module .mod-head{ margin-bottom:22px; }
.slide-module .mod-grid{ gap:48px; align-items:start; }
.slide-module .ft{ padding:12px 0 12px 24px; }
.slide-module .mod-close{ margin-top:10px; }
/* ⑤ 8 個 module 三種律動變體（只改版面比例/順序，不用深底）*/
.slide-module.variant-a .mod-grid{ grid-template-columns:.70fr 1.30fr; }
.slide-module.variant-b .mod-grid{ grid-template-columns:1.30fr .70fr; }
.slide-module.variant-b .mod-feats{ order:2; }
.slide-module.variant-b .mod-video{ order:1; }
.slide-module.variant-c .mod-grid{ grid-template-columns:.68fr 1.32fr; gap:50px; }

.slide-module .mod-video .vslot{ max-height:652px; margin-inline:auto; }
.slide-module.variant-c .mod-video{ transform:scale(1.02); transform-origin:center; }
/* ⑥ compare：白 elevated 表、右欄極淡玫瑰、hairline 分列 */

.c2-hl{ background:var(--paper); border:1px solid rgba(201,129,122,.28); box-shadow:var(--shadow-rose); }

.topbar{ left:max(88px, calc((100vw - 1200px)/2)); right:max(88px, calc((100vw - 1200px)/2)); }
.botbar{ left:max(88px, calc((100vw - 1200px)/2)); }

   ============================================================ */
:root{ --stage-scale:1; --letterbox:#F3EEE6; }
html,body{ width:100%; height:100%; overflow:hidden; }
body{ background:
  radial-gradient(1200px 720px at 50% 50%, rgba(255,253,249,.6), transparent 72%),
  var(--letterbox); }
.stage-shell{ position:fixed; inset:0; overflow:hidden; }
.stage{
  position:absolute; left:50%; top:50%;
  width:1600px; height:900px;
  transform:translate(-50%,-50%) scale(var(--stage-scale));
  transform-origin:center center;
  background:#FFFDF9; overflow:hidden;
  box-shadow:0 0 0 1px rgba(43,43,43,.05), 0 40px 120px -30px rgba(43,43,43,.30);
}
/* deck / slide 改成舞台內絕對定位（原本 fixed 對 viewport）*/
.deck{ position:absolute; inset:0; }
.stage .slide{ position:absolute; padding:86px 92px 56px; }
/* topbar/botbar/hint 改成舞台內絕對定位（覆蓋 P0 的 100vw 對齊軌）*/
.topbar{ position:absolute; top:26px; left:200px; right:200px; }
.wm-logo{ height:52px; width:auto; display:block; }
.botbar{ position:absolute; left:200px; bottom:34px; }
.hint{ position:absolute; left:50%; bottom:34px; transform:translateX(-50%); }
/* 操作層留在 viewport：工具列不縮放；塗鴉 canvas 進舞台隨之縮放 */
.ppt-toolbar{ position:fixed; }
.annot-canvas{ position:absolute; inset:0; z-index:9000; touch-action:none; }
/* 提示列首次翻頁後隱藏；⚠️每頁內容須 ≤ 1600×900，超出會被舞台 overflow:hidden 裁切 */
body.nav-started .hint{ opacity:0; transition:opacity .6s ease; pointer-events:none; }
/* 字級 vw→固定 px（縮放舞台裡 vw 會對到真實 viewport 而失真）*/
.slide-title{ font-size:38px; } .slide-sub{ font-size:21px; }
.cover-title{ font-size:62px; } .cover-sub{ font-size:24px; }
.cover-img .imgslot{ height:500px; }
.cover-panel .cover-title{ font-size:52px; } .cover-panel .cover-sub{ font-size:19px; }
.mod-headline{ font-size:38px; } .ba-big{ font-size:27px; }
.closing-big{ font-size:44px; } .closing-big2{ font-size:40px; }
.vslot.vslot-portrait{ height:440px; }
/* 中和舊的 viewport max-width:1100 reflow（舞台永遠 1600 寬，不該因視窗變窄而重排）*/
.stage .cards-3{ grid-template-columns:repeat(3,1fr); }
.stage .mod-grid{ grid-template-columns:.8fr 1.2fr; }
.stage .flow{ grid-template-columns:repeat(6,1fr); }
/* 手機直式：橫置提示 */
.rotate-hint{ display:none; position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  z-index:10000; padding:11px 18px; border-radius:999px; background:rgba(43,33,31,.88);

  box-shadow:0 10px 30px rgba(43,43,43,.4); }
@media (orientation:portrait) and (max-width:600px){ .rotate-hint{ display:block; } }

const deckEl = document.getElementById('deck');
let __mod = 0;
deckEl.innerHTML = DECK.map(s=>{
  const variant = s.type==='module' ? ' variant-'+['a','b','c'][(__mod++)%3] : '';
  return `<section class="slide slide-${s.type}${variant}">${RENDER[s.type](s)}</section>`;
}).join('');
let slides = Array.from(document.querySelectorAll('.slide'));
let current = 0;
const TOTAL = slides.length;

const dotsEl = document.getElementById('dots');
dotsEl.innerHTML = slides.map((_,i)=>`<button class="dot" data-i="${i}" aria-label="第 ${i+1} 頁"></button>`).join('');
const dotEls = Array.from(dotsEl.children);
dotEls.forEach(d=>d.addEventListener('click',()=>showSlide(+d.dataset.i)));

const pageno = document.getElementById('pageno');
const pad = n => String(n).padStart(2,'0');

function showSlide(i){
  i = Math.max(0, Math.min(TOTAL-1, i));
  slides[current].classList.remove('active');
  current = i;
  slides[current].classList.add('active');
  dotEls.forEach((d,k)=>d.classList.toggle('on', k===current));
  pageno.textContent = `${pad(current+1)} / ${pad(TOTAL)}`;
  document.body.classList.toggle('on-cover', current===0);
  if(current>0) document.body.classList.add('nav-started');
  syncVideos();
}
function syncVideos(){
  slides.forEach((sl,k)=>sl.querySelectorAll('video').forEach(v=>{
    if(k===current){ try{ v.currentTime=0; }catch(e){} v.play().catch(()=>{}); } else { v.pause(); }
  }));
}
showSlide(0);

/* ---------- 舞台等比縮放：填滿任何螢幕（桌機／4K 電視／平板／手機）---------- */
(function stageFit(){
  const fit=()=>{ const s=Math.min(window.innerWidth/1600, window.innerHeight/900); document.documentElement.style.setProperty('--stage-scale', s); };
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', ()=>setTimeout(fit,60));
  document.addEventListener('fullscreenchange', ()=>setTimeout(fit,60));
})();

/* ---------- carousels (auto 輪播) ---------- */
(function initCarousels(){
  document.querySelectorAll('.carousel').forEach(c=>{
    const sl=[...c.querySelectorAll('.cslide')], cp=[...c.querySelectorAll('.ccapt')], dt=[...c.querySelectorAll('.cdot')];
    if(sl.length<2) return;
    let i=0, t; const intv=+c.dataset.int||2600;
    const go=n=>{ i=(n+sl.length)%sl.length; sl.forEach((x,k)=>x.classList.toggle('on',k===i)); cp.forEach((x,k)=>x.classList.toggle('on',k===i)); dt.forEach((x,k)=>x.classList.toggle('on',k===i)); };
    const reset=()=>{ clearInterval(t); t=setInterval(()=>go(i+1),intv); };
    dt.forEach((d,k)=>d.addEventListener('click',()=>{ go(k); reset(); }));
    reset();
  });
})();

/* ============ PPT 模式：click / wheel / keys / fullscreen / 塗鴉 ============ */
(function pptMode(){
  const tb = document.createElement('div');
  tb.className = 'ppt-toolbar';
  tb.innerHTML = `
    <button class="ppt-btn" data-act="prev" title="上一頁 (←)">‹</button>
    <button class="ppt-btn" data-act="next" title="下一頁 (→ / Space)">›</button>
    <span class="ppt-sep"></span>
    <button class="ppt-btn" data-act="fullscreen" title="全螢幕 (F)">⛶</button>
    <button class="ppt-btn" data-act="lock" title="鎖定點擊翻頁（防誤觸）">🔓</button>
    <span class="ppt-sep"></span>
    <button class="ppt-btn" data-tool="pen" title="筆 (P)">✎</button>
    <button class="ppt-btn" data-tool="hl" title="螢光筆 (H)">🖍</button>
    <button class="ppt-btn" data-tool="rect" title="方框 (R)">▭</button>
    <button class="ppt-btn ppt-color" data-color="#C9817A" style="background:#C9817A" title="玫瑰粉"></button>
    <button class="ppt-btn ppt-color" data-color="#D64545" style="background:#D64545" title="紅"></button>
    <button class="ppt-btn ppt-color" data-color="#C99A1F" style="background:#C99A1F" title="金"></button>
    <button class="ppt-btn" data-act="undo" title="上一步 (Ctrl+Z)">↶</button>
    <button class="ppt-btn" data-act="clear" title="清除塗鴉 (C)">⌫</button>`;
  document.body.appendChild(tb);

  const canvas = document.createElement('canvas');
  canvas.className = 'annot-canvas';
  document.getElementById('stage').appendChild(canvas);
  const ctx = canvas.getContext('2d');
  function sizeCanvas(){
    const dpr = window.devicePixelRatio || 1; const OS = Math.max(dpr, 2);
    canvas.width = 1600*OS; canvas.height = 900*OS;
    canvas.style.width = '1600px'; canvas.style.height = '900px';
    ctx.setTransform(OS,0,0,OS,0,0);
  }
  sizeCanvas();
  /* 塗鴉 canvas 固定舞台座標(1600×900)，隨舞台等比縮放；resize 不需重繪 */

  let tool='pen', color='#C9817A', annotMode=false, lockClick=false, drawing=false, startX=0, startY=0, strokes=[];
  function pushUndo(){ try{ strokes.push(canvas.toDataURL()); if(strokes.length>40) strokes.shift(); }catch(e){} }
  function undo(){ if(!strokes.length) return; const d=strokes.pop(); const img=new Image(); img.onload=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,1600,900); }; img.src=d; }
  function clearAnnot(){ strokes=[]; ctx.clearRect(0,0,canvas.width,canvas.height); }
  function setAnnotMode(on){ annotMode=!!on; document.body.classList.toggle('annot-mode',annotMode); if(!annotMode) clearAnnot(); }
  function setTool(t){ if(annotMode && tool===t){ setAnnotMode(false); tb.querySelectorAll('[data-tool]').forEach(b=>b.classList.remove('active')); return; } tool=t; tb.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active', b.dataset.tool===t)); setAnnotMode(true); }
  function setColor(c){ color=c; tb.querySelectorAll('.ppt-color').forEach(b=>b.classList.toggle('active', b.dataset.color===c)); }
  setColor(color);

  const pos = e => { const t=e.touches?e.touches[0]:e; const r=canvas.getBoundingClientRect(); return { x:(t.clientX-r.left)*(1600/r.width), y:(t.clientY-r.top)*(900/r.height) }; };
  canvas.addEventListener('pointerdown', e=>{ if(!annotMode) return; e.preventDefault(); drawing=true; try{canvas.setPointerCapture(e.pointerId);}catch(_){} pushUndo(); const p=pos(e); startX=p.x; startY=p.y;
    if(tool==='pen'||tool==='hl'){ ctx.strokeStyle=color; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=tool==='hl'?16:3; ctx.globalAlpha=tool==='hl'?.32:1; ctx.beginPath(); ctx.moveTo(startX,startY); } });
  canvas.addEventListener('pointermove', e=>{ if(!drawing) return; const p=pos(e);
    if(tool==='pen'||tool==='hl'){ ctx.lineTo(p.x,p.y); ctx.stroke(); }
    else if(tool==='rect'){ const d=strokes[strokes.length-1]; const draw=()=>{ ctx.strokeStyle=color; ctx.lineWidth=3; ctx.globalAlpha=1; ctx.strokeRect(startX,startY,p.x-startX,p.y-startY); };
      if(d){ const img=new Image(); img.onload=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,1600,900); draw(); }; img.src=d; } else { ctx.clearRect(0,0,canvas.width,canvas.height); draw(); } } });
  const endDraw=()=>{ drawing=false; ctx.globalAlpha=1; };
  canvas.addEventListener('pointerup', endDraw); canvas.addEventListener('pointercancel', endDraw);

  tb.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
    const {act,tool:t,color:c}=b.dataset;
    if(act==='prev') showSlide(current-1);
    else if(act==='next') showSlide(current+1);
    else if(act==='fullscreen') toggleFull();
    else if(act==='lock'){ lockClick=!lockClick; b.classList.toggle('active',lockClick); b.textContent=lockClick?'🔒':'🔓'; }
    else if(act==='undo') undo();
    else if(act==='clear') clearAnnot();
    else if(t) setTool(t);
    else if(c) setColor(c); });

  function toggleFull(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }

  document.addEventListener('click', e=>{ if(lockClick||annotMode) return;
    if(e.target.closest('a,button,input,textarea,select,video,.vslot,.carousel,.card,.dcard,.lane,.ovx-cell,.annot-canvas,.ppt-toolbar,.botbar,.topbar')) return;
    if(e.clientX > innerWidth/2) showSlide(current+1); else showSlide(current-1); });

  let wheelLock=false;
  addEventListener('wheel', e=>{ if(annotMode||wheelLock) return; if(Math.abs(e.deltaY)<25) return; wheelLock=true; setTimeout(()=>wheelLock=false,700); showSlide(e.deltaY>0?current+1:current-1); }, {passive:true});

  addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    if(e.key===' '){ e.preventDefault(); showSlide(e.shiftKey?current-1:current+1); }
    else if(e.key==='ArrowRight') showSlide(current+1);
    else if(e.key==='ArrowLeft') showSlide(current-1);
    else if(e.key==='f'||e.key==='F') toggleFull();
    else if(e.key==='d'||e.key==='D') setAnnotMode(!annotMode);
    else if(e.key==='p'||e.key==='P') setTool('pen');
    else if(e.key==='h'||e.key==='H') setTool('hl');
    else if(e.key==='r'||e.key==='R') setTool('rect');
    else if(e.key==='c'||e.key==='C') clearAnnot();
    else if((e.ctrlKey||e.metaKey)&&e.key==='z') undo();
    else if(e.key==='Escape'){ if(annotMode) setAnnotMode(false); } });

  const _show = window.showSlide;
  window.showSlide = function(i){ clearAnnot(); _show(i); };
})();
</script>
