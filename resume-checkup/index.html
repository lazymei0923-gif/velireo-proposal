<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>履歷健檢 Skill｜已搬家</title>
<meta http-equiv="refresh" content="3;url=https://aibizlabco.com/skill/resume-checkup">
<style>
  :root{--bg:#FAF8F6;--ink:#1E2733;--accent:#61796E;--muted:#5f6874;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Noto Sans TC","PingFang TC","Helvetica Neue",sans-serif;
       font-size:17px;line-height:1.7;display:flex;align-items:center;
       justify-content:center;min-height:100vh;padding:24px}
  .card{max-width:520px;width:100%;background:#fff;border-radius:16px;
        padding:48px 40px;box-shadow:0 1px 2px rgba(0,0,0,.06);text-align:center}
  h1{font-size:25px;margin:0 0 12px;letter-spacing:.01em}
  p{margin:0 0 28px;color:var(--muted);font-size:16px}
  a.btn{display:block;text-align:center;background:var(--accent);color:#fff;
        text-decoration:none;padding:16px 24px;border-radius:12px;
        font-weight:600;font-size:17px;min-height:48px;transition:opacity .15s ease-out}
  a.btn:hover{opacity:.88}
  a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
  .note{margin-top:24px;margin-bottom:0;font-size:14px}
  @media (max-width:640px){.card{padding:32px 24px}h1{font-size:20px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="card">
  <h1>🩺 履歷健檢 Skill 已搬家</h1>
  <p>這個頁面不再提供下載，正式頁面在下面。</p>
  <a class="btn" href="https://aibizlabco.com/skill/resume-checkup">前往履歷健檢 Skill</a>
  <p class="note">三秒後會自動幫你跳過去。</p>
</div>
</body>
</html>
